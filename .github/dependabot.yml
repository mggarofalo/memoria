version: 2

# Weekly, one pull request per ecosystem, so that routine bumps stay quiet.
# Major versions arrive on their own because they usually need real work.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /
      - /sidecar
      - /worker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # test/llm-surface.test.ts pins remote mode to the exact QMD version, so
    # upgrading it is a deliberate job and not a routine bump.
    ignore:
      - dependency-name: "@tobilu/qmd"
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # Every project is named, so one pull request covers a package wherever it is used.
  # A major version gets one pull request per package, across all the projects.
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /tools/*
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # Memoria stays on the .NET LTS line. ASP.NET Core's major versions need the
    # matching runtime, so they move with the SDK and base images, by hand.
    # Packages that still ship a build for our target framework, such as
    # Microsoft.Data.Sqlite, keep getting majors.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
      nuget-major:
        patterns: ["*"]
        update-types: [major]
        group-by: dependency-name

  # The base images float on tags such as aspnet:10.0 and node:26-bookworm-slim. This
  # catches new tags; the daily image scan in audit.yml catches a stale build of the same tag.
  - package-ecosystem: docker
    directories:
      - /
      - /sidecar
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # The .NET images stay on the LTS line with the ASP.NET Core packages above.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
    # A Dockerfile's build and runtime stages share a major version, so its
    # majors come together in one pull request rather than one per image.
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
