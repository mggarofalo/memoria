name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Memoria.slnx
      - name: Build
        run: dotnet build Memoria.slnx --no-restore -p:TreatWarningsAsErrors=true
      - name: Test
        run: dotnet test Memoria.slnx --no-build --verbosity normal
      # The served document is pinned to src/Memoria.Api/openapi.json by
      # OpenApiContractTests above; this lints the committed copy.
      - name: OpenAPI lint
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint --fail-severity warn src/Memoria.Api/openapi.json

  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Memoria.slnx
      - name: Check formatting
        run: dotnet format Memoria.slnx --no-restore --verify-no-changes

  cli:
    name: CLI Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -race

  sidecar:
    name: Sidecar Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: OpenAPI drift
        run: npm run openapi:check
      - name: Build
        run: npm run build
      - name: Integration test (real SDK, fixture index, no models)
        run: npm run test:integration
        env:
          MEMORIA_QMD_INTEGRATION: "1"

  cli-lint:
    name: CLI Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Generated client drift
        run: |
          go generate ./...
          git diff --exit-code internal/api
