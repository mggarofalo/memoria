name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A new push to a pull request replaces its running checks. Pushes to main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# The jobs AGENTS.md lists as required status checks are required by the
# `main protection` ruleset, so their names must not change, and they must
# always report. That is why path filtering is done here, per job, and never
# under `on:` above: a job skipped by its `if` still reports and satisfies the
# ruleset, but a workflow skipped by `on.paths` reports nothing and blocks merges.
#
# The `if` runs the job unless the filter positively said "false". The filter
# only runs on pull requests, and if it fails its output is empty, so pushes to
# main and filter failures both run everything.
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      cli: ${{ steps.filter.outputs.cli }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Cross-language contracts are listed on purpose: the C# tests pin
          # sidecar/openapi.json, and the Go client is generated from the API's.
          filters: |
            dotnet:
              - .github/workflows/ci.yml
              - src/**
              - tests/**
              - sidecar/openapi.json
              - Memoria.slnx
              - Directory.Build.props
              - .editorconfig
              - .gitattributes
              - .spectral.yaml
              - CodeMetricsConfig.txt
              - coverage.runsettings
              - dotnet-tools.json
              - scripts/coverage-dotnet.sh
              - tools/**
              - scripts/redaction-report.sh
            cli:
              - .github/workflows/ci.yml
              - cli/**
              - skills/**
              - src/Memoria.Api/openapi.json
              - .gitattributes
              - scripts/coverage-go.sh
            sidecar:
              - .github/workflows/ci.yml
              - sidecar/**
              - worker/**
              - scripts/release/**
              - scripts/e2e/**
              - package.json
              - package-lock.json
              - eslint.config.mjs
              - .gitattributes
            worker:
              - .github/workflows/ci.yml
              - worker/**
              - package.json
              - package-lock.json
              - eslint.config.mjs
              - .gitattributes

  build:
    name: Build & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: |
          dotnet restore Memoria.slnx
          dotnet tool restore
      # CA1502 (cyclomatic complexity) is an error, so this is the complexity gate.
      - name: Build
        run: dotnet build Memoria.slnx --no-restore -p:TreatWarningsAsErrors=true
      # Not in the solution, so nothing else would notice this breaking.
      - name: Build the redaction check
        run: dotnet build tools/RedactionCheck -c Release -p:TreatWarningsAsErrors=true
      - name: Test and branch coverage
        run: sh scripts/coverage-dotnet.sh
      # Uninstrumented, as their budgets are for plain code. The coverage run leaves them out.
      - name: Redaction timing budgets
        run: dotnet test tests/Memoria.Core.Tests --no-build --nologo --verbosity minimal --filter "Category=Timing"
      # The served document is pinned to src/Memoria.Api/openapi.json by
      # OpenApiContractTests above; this lints the committed copy.
      - name: OpenAPI lint
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint --fail-severity warn src/Memoria.Api/openapi.json

  format:
    name: Code Formatting
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore Memoria.slnx
      - name: Check formatting
        run: dotnet format Memoria.slnx --no-restore --verify-no-changes

  cli:
    name: CLI Build & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.cli != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        working-directory: cli
        run: go build ./...
      - name: Test and coverage
        run: sh scripts/coverage-go.sh -race

  cli-lint:
    name: CLI Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.cli != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # Cyclomatic complexity (gocyclo). The version also appears in scripts/check-go.sh.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: cli
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Generated client drift
        run: |
          go generate ./...
          git diff --exit-code internal/api

  sidecar:
    name: Sidecar Build & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sidecar != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json
      - name: Install
        run: |
          npm ci --no-fund --no-audit --prefix ..
          npm ci --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Complexity
        run: npx eslint sidecar scripts/release scripts/e2e scripts/*.mts deploy/mutation-runner
        working-directory: .
      - name: Unit tests and coverage
        run: npm run test:coverage
      - name: Release script tests and coverage
        run: npm run test:coverage
        working-directory: scripts/release
      - name: OpenAPI drift
        run: npm run openapi:check
      - name: Build
        run: npm run build
      - name: Integration test (real SDK, fixture index, no models)
        run: npm run test:integration
        env:
          MEMORIA_QMD_INTEGRATION: "1"

  # Not a required check yet. The real CLI against a real API and sidecar on a
  # throwaway index with no models; see scripts/e2e/README.md.
  e2e:
    name: End-to-end (real API and sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
        working-directory: sidecar
      # The redaction report's second look. A real one, so the flags the tool passes it are really tried.
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rm gitleaks.tar.gz
      # The report's look that is independent of the engine's rules, with verification off, so it calls no service.
      - name: Install trufflehog
        run: |
          curl -fsSL -o trufflehog.tar.gz https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.8/trufflehog_3.99.8_linux_amd64.tar.gz
          echo "7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08  trufflehog.tar.gz" | sha256sum -c -
          tar -xzf trufflehog.tar.gz -C "$RUNNER_TEMP" trufflehog
          rm trufflehog.tar.gz
      - name: Run the checks
        run: node scripts/e2e/run.ts

  # The ingest checks again, against deploy/compose.yaml as shipped, on images built from this commit. Not required: it repeats the job above
  # on another layout, and the checks that need the recording proxy say NOT RUN here.
  e2e-compose:
    name: End-to-end (compose layout)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
        working-directory: sidecar
      - name: Run the checks on the compose layout
        run: node scripts/e2e/run.ts --layout compose

  # The WireGuard tunnel from the API host to a worker, as docs/deployment.md sets it up, simulated in Docker. Not required.
  e2e-wireguard:
    name: End-to-end (WireGuard tunnel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run the tunnel checks
        run: node scripts/e2e/wireguard.ts

  # Not required. The rest of the suite has no models, so its searches are degraded BM25. This runs reranked and
  # filtered search through REST, MCP and the CLI against a real worker: llama.cpp on the runner's CPU, with QMD's
  # embeddinggemma and 0.6B reranker. The files are pinned by SHA-256 in scripts/e2e/rerank-assets.json and cached
  # under a key made from it. On main the cache is saved as soon as they are fetched, so a failing check never costs
  # a download, and a download that fails says so. See scripts/e2e/README.md.
  e2e-rerank:
    name: End-to-end (real reranker on CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
        working-directory: sidecar
      - name: Restore the models and llama.cpp
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/memoria-e2e-rerank
          key: e2e-rerank-${{ hashFiles('scripts/e2e/rerank-assets.json') }}
      - name: Fetch what the cache lacks, checked by SHA-256
        run: node scripts/e2e/rerank-assets.ts "$HOME/.cache/memoria-e2e-rerank"
      # Saved from main only: every branch can read main's cache, and a copy saved per pull request would be
      # about 1 GB each, pushing older entries out of the repository's 10 GB.
      - name: Save them before any check can fail
        if: steps.models.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/memoria-e2e-rerank
          key: e2e-rerank-${{ hashFiles('scripts/e2e/rerank-assets.json') }}
      - name: Run the reranked checks
        run: node scripts/e2e/rerank.ts --assets "$HOME/.cache/memoria-e2e-rerank"

  worker:
    name: Worker Build & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.worker != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install
        run: |
          npm ci --no-fund --no-audit --prefix ..
          npm ci --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Complexity
        run: npx eslint worker
        working-directory: .
      - name: Unit tests and coverage
        run: npm run test:coverage
