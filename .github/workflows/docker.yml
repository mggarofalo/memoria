name: Docker

# `image` proves the Dockerfile on every event and holds no write permission.
# `publish` runs on pushes to main and release tags: it pushes by digest, runs that
# exact digest, and only then points tags at it, so what is tagged is what was checked.
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions: {}

env:
  IMAGE: ghcr.io/mggarofalo/memoria

jobs:
  # The same gate as release.yml, so a tag it would refuse publishes no image.
  gate:
    name: Validate Release Tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release.ts validate "$GITHUB_REF_NAME"

  image:
    name: Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from tags and history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Resolve the version
        id: version
        run: echo "version=$(node scripts/release/release.ts describe)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: memoria:verify
          build-args: MEMORIA_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image's reported version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/release.ts verify-image memoria:verify "$VERSION"

  publish:
    name: Publish Image
    needs: [gate, image]
    # `gate` is skipped on main; anything else from it, or a failed image, stops here.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.image.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Resolve the version
        id: version
        run: echo "version=$(node scripts/release/release.ts describe)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # `edge` follows main and `latest` follows releases. They never overlap.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      # An untagged push: nothing can pull this by name until it has been checked.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MEMORIA_VERSION=${{ steps.version.outputs.version }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
      - name: Verify the pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/release.ts verify-image "$IMAGE@$DIGEST" "$VERSION"
      - name: Point the tags at the verified digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        # TAGS is one tag per line; word splitting is what separates them.
        run: node scripts/release/release.ts tag-image "$IMAGE@$DIGEST" $TAGS

  attest:
    name: Attest Image Provenance
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.publish.outputs.digest }}
