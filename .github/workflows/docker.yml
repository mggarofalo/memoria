name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  checks: read

jobs:
  image:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from tags and history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The same gate as release.yml, so a tag it would refuse publishes no image.
      - name: Validate the release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release.ts validate "$GITHUB_REF_NAME"

      - name: Resolve the version
        id: version
        run: echo "version=$(node scripts/release/release.ts describe)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mggarofalo/memoria
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: memoria:verify
          build-args: MEMORIA_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image's reported version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name memoria-verify -p 8080:8080 -e Memoria__Sidecar__BaseUrl=http://127.0.0.1:8282 memoria:verify
          for attempt in $(seq 1 30); do
            health="$(curl -fsS http://127.0.0.1:8080/health)" && break
            sleep 1
          done
          docker rm -f memoria-verify
          reported="$(echo "$health" | jq -r .version)"
          echo "expected $VERSION, image reports $reported"
          test "$reported" = "$VERSION"

      # Pull requests stop here, having proved the Dockerfile; only pushes to
      # main and release tags publish. The layers come from the cache above.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MEMORIA_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
