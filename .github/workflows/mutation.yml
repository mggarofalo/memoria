name: Mutation

# Run by hand only. Commits on main are mutated on a box of our own instead
# (deploy/mutation-runner, docs/mutation-runner.md), which posts a `mutation`
# commit status; nothing here runs on a pull request or a schedule. A dispatch
# mutates everything and uploads the reports. Thresholds live in stryker/*.json,
# sidecar/stryker*.json, worker/stryker*.json, and cli/.gremlins.yaml.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: Mutation (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Mutate
        run: sh scripts/mutation-dotnet.sh
      - name: Upload report
        # Always: a run that fails a threshold, or is cancelled, still has the reports it finished.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: mutation-dotnet
          path: StrykerOutput/*/reports/
          retention-days: 30

  node:
    name: Mutation (${{ matrix.package }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    # A full sidecar run is about 7,000 mutants, more than one job finishes in 4 hours,
    # so a run splits it into shards (scripts/mutation-shard.mts), each with the
    # package's thresholds.
    # The `integration` shard mutates the store and the SDK wire code with the
    # integration tests running, as nothing else reaches them.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('[{"package":"worker","shard":""},{"package":"sidecar","shard":"1/8"},{"package":"sidecar","shard":"2/8"},{"package":"sidecar","shard":"3/8"},{"package":"sidecar","shard":"4/8"},{"package":"sidecar","shard":"5/8"},{"package":"sidecar","shard":"6/8"},{"package":"sidecar","shard":"7/8"},{"package":"sidecar","shard":"8/8"},{"package":"sidecar","shard":"integration"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.package }}/package-lock.json
      - name: Install
        run: |
          npm ci --no-fund --no-audit
          npm ci --no-fund --no-audit --prefix ${{ matrix.package }}
      - name: Mutate
        # Every five minutes the log shows the runner's headroom, so a run that starves it can be seen coming.
        run: |
          # The most common processes are named by the script they run, so a leak shows what is leaking.
          top() { ps -eo args --no-headers | awk '{ for (i = 1; i <= NF; i++) if ($i ~ /\.(ts|mts|js)$/) { n = split($i, p, "/"); print p[n]; next } print $1 }' | sort | uniq -c | sort -rn | head -3 | awk '{printf "%s%s x%s", (NR > 1 ? ", " : ""), $2, $1}'; }
          ( while sleep 300; do echo "resources: $(free -m | awk 'NR==2 {print $3 " MB used, " $7 " MB available"}'), $(ps -e --no-headers | wc -l) processes ($(top)), load $(cut -d' ' -f1 /proc/loadavg)"; done ) &
          sampler=$!
          status=0
          sh scripts/mutation-js.sh ${{ matrix.package }} || status=$?
          kill "$sampler" 2>/dev/null || true
          exit "$status"
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
      - name: Upload report
        # Always: a run that fails a threshold, or is cancelled, still has the reports it finished.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: mutation-${{ matrix.package }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: ${{ matrix.package }}/reports/
          retention-days: 30

  cli:
    name: Mutation (CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Mutate
        run: sh scripts/mutation-go.sh
      - name: Upload report
        # Always: a run that fails a threshold, or is cancelled, still has the reports it finished.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: mutation-cli
          path: cli/reports/
          retention-days: 30

  # Real Go branch coverage. A slow report, never a gate: statement coverage in
  # CI is what blocks. gobco has no per-file exclusion or threshold of its own,
  # so scripts/coverage-go-branch.sh does that part.
  cli-branch:
    name: Go Branch Coverage (report)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Measure
        run: sh scripts/coverage-go-branch.sh
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-branch-coverage
          path: cli/reports/gobco.txt
          retention-days: 30
