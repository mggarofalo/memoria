name: Mutation

# Slow, so it is not a required check. Pull requests mutate only what changed;
# the nightly run mutates everything and uploads the reports. Thresholds live
# in stryker/*.json, sidecar/stryker*.json, worker/stryker*.json, and
# cli/.gremlins.yaml.
on:
  pull_request:
    branches: ["main"]
    paths:
      - .github/workflows/mutation.yml
      - scripts/mutation-*.sh
      - stryker/**
      - dotnet-tools.json
      - src/**
      - tests/**
      - sidecar/src/**
      - sidecar/test/**
      - sidecar/stryker*.json
      - worker/src/**
      - worker/test/**
      - worker/stryker*.json
      - cli/**
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MUTATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

jobs:
  dotnet:
    name: Mutation (.NET${{ matrix.shard.name && format(', {0}', matrix.shard.name) || '' }})
    runs-on: ubuntu-latest
    # A pull request mutates only what changed, in one job, and stops itself at 50
    # minutes, reporting inconclusive; see scripts/mutation-dotnet.sh. The full run
    # does not fit one job's 4 hours: Memoria.Core alone has about 5,600 mutants, most
    # of them covered by thousands of redaction tests. So it runs as shards in parallel,
    # each with the job limit to itself and its config's thresholds, break included.
    # Core's shards cover every file once; security-core's files are among them, under
    # the same 90% break, so the full run does not mutate them a second time.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        shard: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"","configs":"","mutate":""}]' || '[
            {"name":"core redaction heuristics","configs":"core","mutate":"**/Redaction/SecretHeuristics.cs **/Redaction/PemBlock.cs **/Redaction/PemSeparators.cs"},
            {"name":"core redaction shapes","configs":"core","mutate":"**/Redaction/ValueShapes.cs **/Redaction/RedactionRules.cs **/Redaction/SecretKeyNames.cs **/Redaction/DetectionView.cs"},
            {"name":"core redaction rest","configs":"core","mutate":"**/Redaction/**/*.cs !**/Redaction/SecretHeuristics.cs !**/Redaction/PemBlock.cs !**/Redaction/PemSeparators.cs !**/Redaction/ValueShapes.cs !**/Redaction/RedactionRules.cs !**/Redaction/SecretKeyNames.cs !**/Redaction/DetectionView.cs"},
            {"name":"core sessions","configs":"core","mutate":"**/Sessions/**/*.cs"},
            {"name":"core rest","configs":"core","mutate":"**/*.cs !**/Redaction/**/*.cs !**/Sessions/**/*.cs"},
            {"name":"api","configs":"api","mutate":""},
            {"name":"security","configs":"security","mutate":""}
          ]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Mutate
        run: sh scripts/mutation-dotnet.sh
        env:
          MUTATION_LIMIT_MINUTES: ${{ github.event_name == 'pull_request' && '50' || '' }}
          MUTATION_CONFIGS: ${{ matrix.shard.configs }}
          MUTATION_MUTATE: ${{ matrix.shard.mutate }}
      # Always, pull requests included: a failed score is only actionable with the report,
      # and a run that hits its time limit still has the reports of the configs it finished.
      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-dotnet${{ matrix.shard.name && format('-{0}', strategy.job-index) || '' }}
          path: StrykerOutput/*/reports/
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  node:
    name: Mutation (${{ matrix.package }})
    runs-on: ubuntu-latest
    # A full run takes hours on a hosted runner. A pull request stops itself at 50
    # minutes and reports inconclusive; see scripts/mutation-js.sh.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        package: [sidecar, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.package }}/package-lock.json
      - name: Install
        run: |
          npm ci --no-fund --no-audit
          npm ci --no-fund --no-audit --prefix ${{ matrix.package }}
      - name: Mutate
        run: sh scripts/mutation-js.sh ${{ matrix.package }}
        env:
          MUTATION_LIMIT_MINUTES: ${{ github.event_name == 'pull_request' && '50' || '' }}
      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.package }}
          path: ${{ matrix.package }}/reports/
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  cli:
    name: Mutation (CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Mutate
        run: sh scripts/mutation-go.sh
      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-cli
          path: cli/reports/
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # Real Go branch coverage. A slow report, never a gate: statement coverage in
  # CI is what blocks. gobco has no per-file exclusion or threshold of its own,
  # so scripts/coverage-go-branch.sh does that part.
  cli-branch:
    name: Go Branch Coverage (report)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Measure
        run: sh scripts/coverage-go-branch.sh
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-branch-coverage
          path: cli/reports/gobco.txt
          retention-days: 30
