name: Release

# A vX.Y.Z tag publishes a GitHub release: docs/releasing.md. Pull requests that
# touch this path run everything up to, and not including, publishing.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
      - "cli/**"
      - "sidecar/**"
      - "worker/**"

permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Test the release tooling
        run: node --test "scripts/release/test/**/*.test.ts"

      - name: Validate the tag and resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/release/release.ts validate "$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
          else
            node scripts/release/release.ts next
            # Under the same permissions a tag gets: can this token read what validate reads?
            node scripts/release/release.ts read-checks "$(git rev-parse origin/main)"
            version="0.0.0-dryrun"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Every component derives the tag's version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test "$(node scripts/release/release.ts describe)" = "$VERSION"

      - name: Build the release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/release.ts build "$VERSION" --out dist

      # A second build with an empty compiler cache, in another directory, must match byte for byte.
      - name: Prove the assets are reproducible
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rebuild="$RUNNER_TEMP/rebuild"
          GOCACHE="$RUNNER_TEMP/gocache" node scripts/release/release.ts build "$VERSION" --out "$rebuild"
          diff dist/checksums.txt "$rebuild/checksums.txt"

      - name: Verify checksums and the CLI's reported version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd dist && sha256sum -c checksums.txt)
          tar -xzf "dist/memoria_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/memoria" --version)" = "memoria version $VERSION"

      - name: Verify the service packages outside a checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          work="$RUNNER_TEMP/services"
          mkdir "$work"
          bash scripts/release/verify-services.sh dist "$VERSION" "$work"

      - name: Verify the API's reported version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MEMORIA_EXPECTED_VERSION="$VERSION" dotnet test tests/Memoria.Api.Tests \
            -p:Version="$VERSION" --filter "FullyQualifiedName~Health_ReportsTheStampedVersion"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release.ts notes "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" dist/*
