name: Dependency Audit

# Deliberately not required: a new advisory should raise a flag, not block
# unrelated pull requests. It runs daily and when a dependency file changes.
on:
  schedule:
    - cron: "41 5 * * *"
  pull_request:
    branches: ["main"]
    paths:
      - .github/workflows/audit.yml
      - package-lock.json
      - sidecar/package-lock.json
      - worker/package-lock.json
      - cli/go.sum
      - "**/*.csproj"
      - Dockerfile
      - sidecar/Dockerfile
      - .dockerignore
      - sidecar/.dockerignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  npm:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sidecar, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit production dependencies
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=high

  # Dev tools run on developer machines and in CI, so every severity counts.
  npm-dev-tools:
    name: npm audit (dev tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit the root dev tooling
        run: npm audit --audit-level=moderate

  go:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Run govulncheck
        working-directory: cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  dotnet:
    name: dotnet vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore Memoria.slnx
      # `dotnet list package --vulnerable` exits 0 even when it finds something.
      - name: List vulnerable packages
        run: |
          dotnet list Memoria.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            exit 1
          fi

  # The base images float on their tags, so an image built weeks ago lacks the OS fixes
  # in one built today. This builds each image afresh, pulling the base images and
  # skipping the cache, and fails on a HIGH or CRITICAL finding that has a fix.
  image:
    name: image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile
          - image: sidecar
            context: sidecar
            file: sidecar/Dockerfile
    env:
      TAG: memoria-${{ matrix.image }}:scan
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          CONTEXT: ${{ matrix.context }}
          FILE: ${{ matrix.file }}
        run: docker build --pull --no-cache --tag "$TAG" --file "$FILE" "$CONTEXT"
      - name: Install Trivy
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Scan
        run: '"$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$TAG"'
