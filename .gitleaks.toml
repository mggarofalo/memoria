title = "Memoria gitleaks config"

[extend]
useDefault = true

# Test fixtures hold made-up secrets such as "test-secret-0123456789abcdef".
# Only the entropy-based generic rule is silenced there, so a real provider
# credential pasted into a test is still caught.
[[allowlists]]
description = "Made-up secrets in test fixtures"
targetRules = ["generic-api-key"]
paths = [
  '''^(sidecar|worker)/test/''',
  '''^tests/''',
  '''^cli/.*_test\.go$''',
]

# Gitleaks's own rules, as data. Some patterns hold a literal token prefix, which the rules then match.
# A test regenerates this file from the pinned upstream gitleaks.toml, which gitleaks already skips.
[[allowlists]]
description = "Imported gitleaks rule patterns"
paths = ['''^src/Memoria\.Core/Redaction/Gitleaks/rules\.json$''']
