# Installed by `npm ci` at the repository root. Each job runs only when its
# language has staged files. Mutation testing never runs here; see mutation.yml.
# Timings and the rules behind this file are in "Quality gates" in AGENTS.md.
pre-commit:
  parallel: true
  jobs:
    # Says so when this Node is older than package.json's engines, since the hooks run under it. A warning only.
    - name: node-version
      run: node scripts/check-node.mjs

    # The tests run without coverage collection, which took four times as long; CI's Build & Test keeps the branch
    # coverage gate (scripts/coverage-dotnet.sh). The timing tests run on their own, uninstrumented, as in CI.
    - name: dotnet
      glob:
        - "src/**"
        - "tests/**"
        - "tools/**"
        - "sidecar/openapi.json"
        - "*.slnx"
        - "Directory.Build.props"
        - "CodeMetricsConfig.txt"
        - "coverage.runsettings"
      run: >-
        dotnet format Memoria.slnx --verify-no-changes &&
        dotnet build Memoria.slnx -p:TreatWarningsAsErrors=true --nologo --verbosity quiet &&
        dotnet test Memoria.slnx --no-build --nologo --verbosity quiet --filter "Category!=Timing" &&
        dotnet test tests/Memoria.Core.Tests --no-build --nologo --verbosity quiet --filter "Category=Timing"

    # The tests that hold the docs and the skills to the code, for a commit that changes only those. Go cannot see
    # skills/ change, as it is outside the module, hence -count=1.
    - name: docs
      glob:
        - "docs/**"
        - "skills/**"
        - "README.md"
        - "sidecar/**/*.md"
        - "worker/**/*.md"
      run: >-
        node --test sidecar/test/docs-match-code.test.ts worker/test/docs-match-code.test.ts &&
        go -C cli test ./... -count=1 &&
        dotnet test tests/Memoria.Api.Tests --nologo --verbosity quiet --filter "FullyQualifiedName~DocsMatchCode"

    - name: sidecar
      root: "sidecar/"
      glob: "**/*.{ts,json}"
      run: >-
        npm run typecheck --silent &&
        node ../node_modules/eslint/bin/eslint.js . &&
        npm run test:coverage --silent

    - name: worker
      root: "worker/"
      glob: "**/*.{ts,json}"
      run: >-
        npm run typecheck --silent &&
        node ../node_modules/eslint/bin/eslint.js . &&
        npm run test:coverage --silent

    - name: release-scripts
      root: "scripts/release/"
      glob: "**/*.{ts,json}"
      run: >-
        npm run typecheck --silent --prefix ../../sidecar &&
        node ../../node_modules/eslint/bin/eslint.js . &&
        npm run test:coverage --silent

    - name: e2e-scripts
      root: "scripts/e2e/"
      glob: "**/*.ts"
      run: >-
        npm run typecheck --silent --prefix ../../sidecar &&
        node ../../node_modules/eslint/bin/eslint.js .

    # -race needs cgo, which most Windows machines lack, so hooks leave it to CI.
    - name: cli
      root: "cli/"
      glob: "**/*.{go,mod,sum,yml,yaml}"
      run: node ../scripts/run-sh.mjs ../scripts/check-go.sh
