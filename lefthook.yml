# Installed by `npm ci` at the repository root. Each job runs only when its
# language has staged files. Mutation testing never runs here; see mutation.yml.
# Timings and the rules behind this file are in "Quality gates" in AGENTS.md.
pre-commit:
  parallel: true
  jobs:
    - name: dotnet
      glob:
        - "src/**"
        - "tests/**"
        - "*.slnx"
        - "Directory.Build.props"
        - "CodeMetricsConfig.txt"
        - "coverage.runsettings"
      run: >-
        dotnet format Memoria.slnx --verify-no-changes &&
        dotnet build Memoria.slnx -p:TreatWarningsAsErrors=true --nologo --verbosity quiet &&
        node scripts/run-sh.mjs scripts/coverage-dotnet.sh

    - name: sidecar
      root: "sidecar/"
      glob: "**/*.{ts,json}"
      run: >-
        npm run typecheck --silent &&
        node ../node_modules/eslint/bin/eslint.js . &&
        npm run test:coverage --silent

    - name: worker
      root: "worker/"
      glob: "**/*.{ts,json}"
      run: >-
        npm run typecheck --silent &&
        node ../node_modules/eslint/bin/eslint.js . &&
        npm run test:coverage --silent

    - name: release-scripts
      root: "scripts/release/"
      glob: "**/*.{ts,json}"
      run: >-
        npm run typecheck --silent --prefix ../../sidecar &&
        node ../../node_modules/eslint/bin/eslint.js . &&
        npm run test:coverage --silent

    # -race needs cgo, which most Windows machines lack, so hooks leave it to CI.
    - name: cli
      root: "cli/"
      glob: "**/*.{go,mod,sum,yml,yaml}"
      run: node ../scripts/run-sh.mjs ../scripts/check-go.sh
