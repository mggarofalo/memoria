# Memoria.Api on the always-on host (homelab today). The memoria-qmd sidecar
# is a separate service on the model host; point MEMORIA_SIDECAR_URL at it.
# See docs/deployment.md.
#
#   MEMORIA_SIDECAR_URL=http://192.168.1.20:8282 \
#   MEMORIA_SIDECAR_SECRET=... \
#   docker compose -f deploy/compose.yaml up -d

services:
  memoria-api:
    image: ghcr.io/mggarofalo/memoria:latest
    container_name: memoria-api
    restart: unless-stopped
    environment:
      Memoria__Sidecar__BaseUrl: ${MEMORIA_SIDECAR_URL:?set MEMORIA_SIDECAR_URL to the sidecar, e.g. http://192.168.1.20:8282}
      Memoria__Sidecar__Secret: ${MEMORIA_SIDECAR_SECRET:?set MEMORIA_SIDECAR_SECRET to the sidecar's MEMORIA_QMD_SECRET}
      Memoria__Sidecar__ReadyRequiresModels: "true"
      Memoria__Search__RerankByDefault: "true"
    ports:
      # LAN only. Public exposure goes through the reverse proxy once the
      # homelab hardening and API-key work land; do not publish on 0.0.0.0 of
      # a host with a public interface before then.
      - "${MEMORIA_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "dotnet", "Memoria.Api.dll", "--health-check"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
