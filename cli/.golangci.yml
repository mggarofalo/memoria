version: "2"

linters:
  # Only complexity. govet and gofmt already run as their own CI steps.
  default: none
  enable:
    - gocyclo
  settings:
    gocyclo:
      min-complexity: 10
  exclusions:
    # Skips files with the standard "Code generated ... DO NOT EDIT." header,
    # which is how internal/api/client.gen.go is left out.
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
